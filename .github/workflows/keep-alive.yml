name: Keep Backend Alive
on:
  schedule:
    - cron: '*/5 * * * *' # Every 5 minutes
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        run: |
          curl --fail -X POST https://springtoo.onrender.com/graphql \
            -H "Content-Type: application/json" \
            -d '{"query": "query getAllCourses { courses { content { createdAt currency description durationHours id level isActive price shortDescription title topicId updatedAt } } }"}'
