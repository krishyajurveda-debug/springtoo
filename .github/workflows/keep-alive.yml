name: Keep Backend Alive
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: |
          curl -f -X POST https://springtoo.onrender.com/graphql \
          -H "Content-Type: application/json" \
          -d '{"query": "query { courses { content { id } } }"}'
